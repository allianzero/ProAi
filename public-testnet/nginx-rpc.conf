# Replace rpc-testnet.proai.example with a real domain, then:
# certbot --nginx -d rpc-testnet.proai.example
server {
    listen 443 ssl;
    server_name rpc-testnet.proai.example;

    # ssl_certificate /etc/letsencrypt/live/rpc-testnet.proai.example/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/rpc-testnet.proai.example/privkey.pem;

    client_max_body_size 1m;

    location / {
        # Only forward to the local geth RPC. Never expose personal/clique to the public.
        # For a public endpoint, put the filtered proxy (filtered_rpc.py) here instead of raw geth.
        proxy_pass http://127.0.0.1:8545;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
